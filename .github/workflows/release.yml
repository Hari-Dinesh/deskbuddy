name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: bash scripts/package.sh
      - run: bash scripts/test.sh
      - run: gh release create "$GITHUB_REF_NAME" .build/DeskBuddy-*-universal.zip .build/SHA256SUMS --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
